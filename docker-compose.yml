# Local verification stack. `docker compose up -d --build`, then
# `docker compose run --rm verify node scripts/verify-<step>.mjs`.
name: dsites

x-app: &app
  build:
    context: .
    dockerfile: docker/Dockerfile
  image: dsites-app:local

services:
  workers:
    <<: *app
    command: ["bash", "docker/workers.sh"]
    environment:
      ADMIN_TOKEN: dev-admin-token
      TURNSTILE_SECRET: 1x0000000000000000000000000000000AA
      HASH_PEPPER: dev-pepper
      MAIL_PIT_URL: http://mailpit:8025
      CF_API_BASE: http://cf-mock:8790/client/v4
      CF_ZONE_ID: mock-zone
      CF_API_TOKEN: mock-token
      BLOG_RSS_BASE: http://cf-mock:8790/fixtures/naver-rss
      OPENAI_API_KEY: mock-openai-key
      OPENAI_BASE_URL: http://cf-mock:8790/openai/v1
      OPENAI_IMAGE_MODEL: gpt-image-1
      IMAGE_COST_USD: "0.04"
    ports:
      - "8787:8787" # router: http://<slug>.localhost:8787
      - "8788:8788" # api
      - "8789:8789" # operator console
      - "8791:8791" # Authentik stand-in (OIDC)
    volumes:
      - state:/state
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "Promise.all([fetch('http://127.0.0.1:8788/health'),fetch('http://127.0.0.1:8787/'),fetch('http://127.0.0.1:8789/auth/login',{redirect:'manual'}),fetch('http://127.0.0.1:8791/jwks')]).then(r=>process.exit(r[0].ok&&r[2].status===302&&r[3].ok?0:1)).catch(()=>process.exit(1))"
      interval: 3s
      timeout: 3s
      retries: 60

  # Cloudflare for SaaS custom hostname API stand-in (docker/cf-mock.mjs).
  cf-mock:
    <<: *app
    command: ["node", "docker/cf-mock.mjs"]
    ports:
      - "8790:8790"

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025" # inbox UI and HTTP API

  # Runs verification scripts inside the workers' network namespace, so 127.0.0.1 and
  # *.localhost reach the Workers exactly as they do on a developer machine.
  verify:
    <<: *app
    profiles: [tools]
    network_mode: "service:workers"
    # Chrome needs more than Docker's 64 MB /dev/shm (Lighthouse tabs crashed without it).
    shm_size: 1gb
    depends_on:
      workers:
        condition: service_healthy
    environment:
      API_URL: http://127.0.0.1:8788
      ADMIN_TOKEN: dev-admin-token
      MAILPIT_URL: http://mailpit:8025
      CF_MOCK_URL: http://cf-mock:8790
    volumes:
      - ./evidence:/app/evidence
      # Same local D1/R2/KV state as the workers, for checks that read or seed storage directly.
      - state:/state

volumes:
  state:

# M0: render-on-request PoC. M1 moves rendering to publish time (api) and this
# Worker to Host → KV pointer → R2 serving.
name = "sites-router-m0"
main = "src/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

[assets]
# Template-versioned shared assets built by @sites/renderer.
directory = "../../packages/renderer/dist/public"
binding = "ASSETS"

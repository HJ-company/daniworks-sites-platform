# Platform API: site/version CRUD, preview, publish (render → R2 → KV), rollback.
name = "sites-api"
main = "src/index.ts"
# Daniworks account (owns the dsites.kr zone). Local dev ignores it.
account_id = "358a1b6caabcf91741109efca1ec0547"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

# Safety net: re-sync router KV records that lag D1 (see src/routes.ts).
[triggers]
crons = ["*/5 * * * *", "17 * * * *"]

[vars]
# Public sites are served at <slug>.<BASE_DOMAIN>. Local dev uses *.localhost.
BASE_DOMAIN = "localhost"
PUBLIC_SCHEME = "http"
API_ORIGIN = "http://127.0.0.1:8788"
# Customer draft links: the router answers /preview/<token> on the bare base domain.
PREVIEW_ORIGIN = "http://localhost:8787"
# Authentik stand-in (docker/oidc-mock.mjs): one issuer locally, one per application in Authentik.
CONSOLE_OIDC_ISSUER = "http://127.0.0.1:8791"
CONSOLE_OIDC_CLIENT_ID = "dsites-console"
MCP_OIDC_ISSUER = "http://127.0.0.1:8791"
MCP_OIDC_CLIENT_ID = "dsites-mcp"
# Cloudflare's always-pass test key; the matching test secret goes in .dev.vars.
TURNSTILE_SITE_KEY = "1x00000000000000000000AA"
MAIL_MODE = "mailpit"
MAIL_FROM = "noreply@dsites.kr"
DOMAIN_CNAME_TARGET = "connect.dsites.kr"
# Custom domains locally: CF_API_BASE / CF_ZONE_ID / CF_API_TOKEN in .dev.vars (Docker: cf-mock).
# ADMIN_TOKEN comes from .dev.vars locally and a secret in production.
# Secrets: ADMIN_TOKEN, OPENAI_API_KEY. From .dev.vars locally, `wrangler secret put` in production.
# OPENAI_IMAGE_MODEL is also set in .dev.vars until the model is fixed.

[[d1_databases]]
binding = "DB"
database_name = "daniworks-sites"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "SITES"
bucket_name = "daniworks-sites"

[[kv_namespaces]]
binding = "ROUTES"
id = "00000000000000000000000000000000"

# Deployed environments. Bindings and vars are not inherited by environments, so each repeats them.
# Staging deploys on every push to main (.github/workflows/deploy-staging.yml); production on a
# release tag or a manual run after approval (deploy-production.yml). Secrets are set once per env
# with `wrangler secret put <NAME> --env <env>`: ADMIN_TOKEN, TURNSTILE_SECRET, HASH_PEPPER,
# CF_ZONE_ID (dsites.kr), CF_API_TOKEN (SSL and Certificates: Edit), OPENAI_API_KEY.

# Staging: public sites on <slug>.staging.daniworks.kr (the router's zone), the API next to
# production's on dsites.kr. api-staging.dsites.kr/* is more specific than production's `*/*`.
[env.staging]
name = "sites-api-staging"
workers_dev = false
preview_urls = false
routes = [{ pattern = "api-staging.dsites.kr/*", zone_name = "dsites.kr" }]

[env.staging.triggers]
crons = ["*/5 * * * *", "17 * * * *"]

[env.staging.vars]
BASE_DOMAIN = "staging.daniworks.kr"
PUBLIC_SCHEME = "https"
API_ORIGIN = "https://api-staging.dsites.kr"
PREVIEW_ORIGIN = "https://staging.daniworks.kr"
CONSOLE_OIDC_ISSUER = "https://authentik.daniworks.kr/application/o/dsites-console-staging/"
CONSOLE_OIDC_CLIENT_ID = "dsites-console-staging"
MCP_OIDC_ISSUER = "https://authentik.daniworks.kr/application/o/dsites-mcp-staging/"
MCP_OIDC_CLIENT_ID = "dsites-mcp-staging"
# TURNSTILE_SITE_KEY: widget whose hostnames include api-staging.dsites.kr (the frame host).
MAIL_MODE = "binding"
MAIL_FROM = "noreply@dsites.kr"
CF_API_BASE = "https://api.cloudflare.com/client/v4"
# Custom hostnames share production's SaaS zone (dsites.kr). Their traffic reaches production's
# router unless a test hostname gets its own route to sites-router-staging (docs/deploy.md).
DOMAIN_CNAME_TARGET = "connect.dsites.kr"

# Cloudflare Email Service; dsites.kr must be onboarded for sending (wrangler email sending enable).
[[env.staging.send_email]]
name = "EMAIL"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "daniworks-sites-staging"
database_id = "fc09d755-f8b2-43e1-9bcf-55a00786d15a"
migrations_dir = "migrations"

[[env.staging.r2_buckets]]
binding = "SITES"
bucket_name = "daniworks-sites-staging"

[[env.staging.kv_namespaces]]
binding = "ROUTES"
id = "81f56d8264ab431ab7ca5da79add2496"

# Production: public sites on <slug>.dsites.kr and customer domains (Cloudflare for SaaS).
[env.production]
name = "sites-api-production"
workers_dev = false
preview_urls = false
# More specific than the router's `*/*`, so it wins for this host.
routes = [{ pattern = "api.dsites.kr/*", zone_name = "dsites.kr" }]

[env.production.triggers]
crons = ["*/5 * * * *", "17 * * * *"]

[env.production.vars]
BASE_DOMAIN = "dsites.kr"
PUBLIC_SCHEME = "https"
API_ORIGIN = "https://api.dsites.kr"
PREVIEW_ORIGIN = "https://dsites.kr"
CONSOLE_OIDC_ISSUER = "https://authentik.daniworks.kr/application/o/dsites-console/"
CONSOLE_OIDC_CLIENT_ID = "dsites-console"
MCP_OIDC_ISSUER = "https://authentik.daniworks.kr/application/o/dsites-mcp/"
MCP_OIDC_CLIENT_ID = "dsites-mcp"
# TURNSTILE_SITE_KEY: widget whose hostnames include api.dsites.kr (the frame host).
MAIL_MODE = "binding"
MAIL_FROM = "noreply@dsites.kr"
CF_API_BASE = "https://api.cloudflare.com/client/v4"
DOMAIN_CNAME_TARGET = "connect.dsites.kr"

[[env.production.send_email]]
name = "EMAIL"

[[env.production.d1_databases]]
binding = "DB"
database_name = "daniworks-sites-production"
database_id = "04157951-5c0a-4dfa-b97a-8c37e982df6e"
migrations_dir = "migrations"

[[env.production.r2_buckets]]
binding = "SITES"
bucket_name = "daniworks-sites-production"

[[env.production.kv_namespaces]]
binding = "ROUTES"
id = "1f7ad9d80569455281b9a1d8bbbe74c8"
